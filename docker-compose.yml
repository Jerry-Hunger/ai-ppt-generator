services:
  postgres:
    image: postgres:16-alpine
    container_name: aippt-postgres
    environment:
      POSTGRES_USER: aippt
      POSTGRES_PASSWORD: aippt
      POSTGRES_DB: aippt
    ports:
      - "39432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aippt -d aippt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aippt-redis
    ports:
      - "39379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
