[project]
name = "aippt-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.4.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pwdlib[bcrypt]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-pptx>=1.0.2",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
